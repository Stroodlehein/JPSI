name: Update JPSI price feeds

on:
  schedule:
    # Weekday price refresh window.
    # Runs hourly from 09:17–18:17 JST, then every 30 minutes from 19:17–21:47 JST.
    # This gives the daily JPMI history row several chances to create/update after the official 19:00 JST observation time.
    - cron: "17 0-9 * * 1-5"       # 09:17–18:17 JST, Mon–Fri
    - cron: "17,47 10-12 * * 1-5"  # 19:17, 19:47, 20:17, 20:47, 21:17, 21:47 JST, Mon–Fri
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-jpsi-price-feeds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull latest
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch prices -> prices.json and jpmi-history.json
        run: |
          python scripts/fetch_prices.py

      - name: Commit updated prices and JPMI history
        run: |
          git config user.name "JPMI Bot"
          git config user.email "bot@japanphysicalmetals.jp"
          git add prices.json jpmi-history.json
          git diff --cached --quiet || git commit -m "Update price feeds $(date -u +'%Y-%m-%d %H:%M')"
          git push
